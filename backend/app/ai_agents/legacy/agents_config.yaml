agents:
      
  - name: sir_hawkington
    module: app.ai_agents.sir_hawkington.distributed_hawkington
    class: SirHawkingtonDistributed
    role: triage and insights
    retry_attempts: 2
    config:
      distributed_enabled: true
      resource_monitoring:
        cpu_threshold: 70.0

  - name: meth_snail
    module: app.ai_agents.meth_snail.distributed_meth_snail
    class: MethSnailDistributed
    role: Memory Optimization Specialist
    retry_attempts: 3
    config:
      distributed_enabled: true
      resource_monitoring:
        memory_threshold: 75.0

  - name: hamsters
    module: app.ai_agents.hamsters.distributed_hamsters
    class: HamstersDistributed
    role: Storage/Disk Engineers
    retry_attempts: 2
    config:
      distributed_enabled: true
      resource_monitoring:
        disk_threshold: 80.0

  - name: quantum_shadow_people
    module: app.ai_agents.quantum_shadow_people.distributed_qsp
    class: QuantumShadowPeopleDistributed
    role: Network Specialists
    retry_attempts: 3
    config:
      distributed_enabled: true
      resource_monitoring:
        network_threshold: 85.0

  - name: vic_20_sage
    module: app.ai_agents.vic_20_sage.distributed_vic20
    class: VIC20SageDistributed
    role: Auto-Tuner and Orchestrator
    retry_attempts: 2
    config:
      distributed_enabled: true
      resource_monitoring:
        cpu_threshold: 75.0
  
  - name: the_stick
    module: app.ai_agents.the_stick.distributed_stick
    class: TheStickDistributed
    role: Compliance and Learning Coordinator
    retry_attempts: 1
    config:
      distributed_enabled: true
      resource_monitoring:
        cpu_threshold: 80.0





