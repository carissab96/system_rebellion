# pyproject.toml
[tool.poetry]
name = "system_rebellion"
version = "0.1.0"
description = "Backend services for System Rebellion"
authors = ["Carissa Bays bayscarissa706@gmail.com"]
packages = [{include = "backend"}]


[tool.pytest.ini]
#asyncio_mode = auto
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]



[tool.poetry.dependencies]
python = "^3.11"
aiohappyeyeballs = "2.6.1"
aiohttp = "3.12.15"
aiosignal = "1.4.0"
aiosqlite = "0.21.0"
alembic = "1.12.1"
annotated-types = "0.7.0"
anyio = "3.7.1"
asgiref = "3.9.1"
async-timeout = "5.0.1"
attrs = "25.3.0"
bcrypt = "4.3.0"
build = "1.3.0"
certifi = "2025.1.31"
channels = "4.2.0"
charset-normalizer = "3.4.2"
click = "8.1.8"
django = "4.2.23"
dnspython = "2.7.0"
ecdsa = "0.19.1"
email-validator = "2.2.0"
fastapi = "0.104.1"
frozenlist = "1.7.0"
greenlet = "3.1.1"
h11 = "0.14.0"
idna = "3.10"
itsdangerous = "2.2.0"
mako = "1.2.4"
markdown-it-py = "3.0.0"
markupsafe = "2.1.2"
mdurl = "0.1.2"
multidict = "6.6.3"
numpy = "2.0.2"
packaging = "25.0"
passlib = "1.7.4"
propcache = "0.3.2"
psutil = "7.0.0"
psycopg2-binary = "2.9.10"
pyasn1 = "0.4.8"
pydantic = "2.10.6"
pydantic-core = "2.27.2"
pydantic-settings = "2.1.0"
pygments = "2.19.2"
pyproject-hooks = "1.2.0"
python-dotenv = "1.0.0"
python-jose = "3.3.0"
python-multipart = "0.0.20"
pyyaml = "6.0.3"
redis = "5.2.1"
