

services:
  # Redis - replacing your IBM ThinkPad
  redis:
    image: redis:7-alpine
    container_name: rebellion-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # PostgreSQL with pgvector - your database
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rebellion-postgres
    environment:
      POSTGRES_USER: rebellion
      POSTGRES_PASSWORD: rebellion_secret
      POSTGRES_DB: system_rebellion
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rebellion -d system_rebellion"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Backend - FastAPI + Uvicorn
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rebellion-backend
    environment:
      - DB_URL=postgresql+asyncpg://rebellion:rebellion_secret@postgres:5432/system_rebellion
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=${SECRET_KEY:-development_secret_change_in_production}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=480
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - ENV=production
      - DEBUG=false
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://localhost:8000"]
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 2 &&
        echo 'Running migrations...' &&
        cd /app/backend &&
        alembic upgrade head &&
        echo 'Starting backend...' &&
        uvicorn main:app --host 0.0.0.0 --port 8000
      "

  # Frontend - Vite dev server (for development/demo)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: rebellion-frontend
    environment:
      - VITE_WS_URL=ws://localhost:8000
      - VITE_API_URL=http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  redis_data:
  postgres_data: