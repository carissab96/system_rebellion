services:
  # Backend API Service
  - type: web
    name: system-rebellion-api
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: system-rebellion-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://system-rebellion.onrender.com"
      - key: ENVIRONMENT
        value: "production"

  # Frontend Service
  - type: web
    name: system-rebellion-frontend
    env: node
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm run preview -- --host 0.0.0.0 --port $PORT"
    envVars:
      - key: VITE_API_URL
        value: "https://system-rebellion-api.onrender.com"
      - key: VITE_WS_URL
        value: "wss://system-rebellion-api.onrender.com"
      - key: VITE_APP_NAME
        value: "System Rebellion"

databases:
  - name: system-rebellion-db
    databaseName: system_rebellion
    user: system_rebellion_user
